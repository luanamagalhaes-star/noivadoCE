<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>C &amp; E — Noivado — DD.MM.AAAA</title>

<!-- ══════════════════════════════════════════════════════════════
     FONTE DE APOIO (texto corrido). A fonte dos TÍTULOS não existe
     como fonte de computador — os títulos (nomes, "Programação")
     vão virar IMAGENS (ver comentário mais abaixo, perto do Hero).
     ══════════════════════════════════════════════════════════════ -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet"/>

<style>
:root{
  /* ── PALETA — tirada das estampas que você mandou (vinho + creme) ── */
  --vinho:#8A171A;       /* vermelho/vinho principal — títulos, ícones, detalhes */
  --vinho-escuro:#5E0F11;/* vinho mais escuro — hover, contraste */
  --texto:#4A2A26;       /* cor do texto corrido (marrom-avermelhado escuro, mais suave que preto) */
  --cream:#F3EFE5;       /* fundo claro */

  --push:'Cormorant Garamond',Georgia,serif; /* PLACEHOLDER até a imagem da fonte de título chegar */
  --cg:'BIZ UDGothic',sans-serif;            /* corpo de texto */

  --stripe-w:96px; /* largura da faixa lateral com a estampa de listras */
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}

body{
  font-family:var(--cg);
  color:var(--texto);
  overflow-x:hidden;
  background-color:var(--cream);
}

/* FAIXA LATERAL — usa a estampa de listras que você mandou (/estampa-listras.jpg) */
.stripes-wrap{
  position:relative;
  overflow:hidden;
}
.stripes-wrap::before,
.stripes-wrap::after{
  content:'';
  position:absolute;
  top:0;bottom:0;
  width:var(--stripe-w);
  background-image:url('/estampa-listras.jpg');
  background-size:180px auto;
  background-repeat:repeat;
  pointer-events:none;
  z-index:2;
}
.stripes-wrap::before{left:0;}
.stripes-wrap::after{right:0;}

/* ── HERO ── */
#hero{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  padding:40px 40px;
  text-align:center;
}
/* Monograma (corações C+E que você mandou) */
.hero-mono{width:460px;max-width:88vw;height:auto;display:block;}

/* Faixa com a estampa paisley, logo abaixo dos títulos do Hero */
.hero-paisley-band{
  width:100%;
  height:72px;
  background-image:url('/estampa-paisley.jpg');
  background-size:220px auto;
  background-repeat:repeat;
}

/* ── SEÇÃO ── */
.sec{
  padding:80px 60px;
  text-align:center;
  max-width:960px;
  margin:0 auto;
}
.div-line{
  height:1px;
  margin:0 var(--stripe-w);
  background:linear-gradient(to right,transparent,rgba(138,23,26,.2),transparent);
}
.body-p{
  font-family:var(--cg);font-size:1.15rem;color:var(--texto);
  opacity:.75;line-height:1.8;max-width:560px;margin:0 auto;
}

/* ── PROGRAMAÇÃO — 2 dias lado a lado (empilha no mobile) ── */
.prog-row{
  display:grid;grid-template-columns:1fr 1fr;gap:56px;
  text-align:center;
}
.prog-single{display:flex;flex-direction:column;align-items:center;gap:8px;}
/* Ícone de cada dia — você vai mandar um pra sexta e outro pro sábado */
.prog-icon{height:170px;width:auto;object-fit:contain;margin-bottom:12px;}
.prog-day{
  font-family:var(--push);font-size:2.6rem;color:var(--vinho);line-height:1;margin-bottom:4px;
}
.prog-dt{
  font-family:var(--cg);font-size:1.4rem;letter-spacing:.1em;
  color:var(--texto);opacity:.85;
}
.prog-loc{
  font-family:var(--cg);font-size:1.35rem;color:var(--texto);opacity:.7;line-height:1.7;
  margin-top:8px;
}
.prog-traje{
  font-family:var(--cg);font-size:1.25rem;font-style:italic;color:var(--texto);opacity:.65;
  margin-top:16px;
}

/* ── FOOTER — usa a estampa paisley com o monograma C+E que você mandou ── */
footer{
  text-align:center;padding:64px 40px;
  background-image:url('/estampa-paisley.jpg');
  background-size:340px auto;
  background-repeat:repeat;
}
.fn{font-family:var(--push);font-size:3rem;color:var(--cream);margin-bottom:12px;text-shadow:0 1px 3px rgba(0,0,0,.25);}
.fd{font-family:var(--cg);font-size:.9rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(243,239,229,.85);text-shadow:0 1px 3px rgba(0,0,0,.25);}

/* ── TABLET ── */
@media(max-width:900px){
  :root{ --stripe-w:56px; }
  .sec{ padding:56px 32px; }
  .prog-row{ gap:40px; }
}

/* ── MOBILE ── */
@media(max-width:600px){
  :root{ --stripe-w:10px; }
  #hero{ padding:32px 20px; }
  .hero-mono{ width:280px; }
  .hero-paisley-band{ height:48px; background-size:160px auto; }
  .sec{ padding:44px 20px; }
  .prog-row{ grid-template-columns:1fr; gap:36px; }
  .prog-icon{ height:120px; }
  .prog-day{ font-size:2.1rem; }
  .prog-dt{ font-size:1.2rem; }
  .prog-loc{ font-size:1.15rem; }
  .prog-traje{ font-size:1.1rem; }
  .body-p{ font-size:1.05rem; }
  .fn{ font-size:2.4rem; }
  .fd{ font-size:.78rem; letter-spacing:.18em; }
}
</style>
</head>
<body>

<!-- ══════════════ HERO ══════════════
     - .hero-mono → o monograma dos coraçõezinhos C+E que você mandou (já aplicado)
     - .hero-title/.hero-date → "Noivado" + a data, em texto (a fonte especial
       ainda não existe; quando você mandar a imagem das palavras, é só trocar
       esse texto pela <img>, do mesmo jeito que foi feito antes). -->
<section id="hero">
  <img class="hero-mono" src="/monograma-ce-completo.png" alt="Noivado Carol &amp; Dudu"/>
</section>

<div class="hero-paisley-band"></div>

<div class="stripes-wrap">

<div class="div-line"></div>

<!-- ══════════════ PROGRAMAÇÃO — Sexta e Sábado ══════════════
     Troque os ícones (/icone-sexta.png / icone-sabado.png) pelos que
     você vai mandar, e preencha horário/local/traje de cada dia. -->
<section id="programacao">
  <div class="sec" style="position:relative;z-index:1;">

    <div class="prog-row">
      <!-- SEXTA-FEIRA (ícone vinho) -->
      <div class="prog-single">
        <img class="prog-icon" src="/icone-sexta.png" alt="Folha de palmeira" onerror="this.style.display='none'"/>
        <div class="prog-day">Sexta-feira</div>
        <div class="prog-dt">4 de Dezembro &nbsp;|&nbsp; 11 horas</div>
        <p class="prog-loc">Beach Day<br/>Al Mar — Trancoso, Bahia</p>
        <div class="prog-traje">Traje: biquíni &amp; bermuda</div>
      </div>
      <!-- SÁBADO (ícone bege) -->
      <div class="prog-single">
        <img class="prog-icon" src="/icone-sabado.png" alt="Folha de palmeira" onerror="this.style.display='none'"/>
        <div class="prog-day">Sábado</div>
        <div class="prog-dt">5 de Dezembro &nbsp;|&nbsp; 14 horas</div>
        <p class="prog-loc">Noivado<br/>Terra Vista Golf — Casa 17<br/>Trancoso, Bahia</p>
        <div class="prog-traje">Traje: beach chique all white</div>
      </div>
    </div>

  </div>
</section>

</div><!-- /stripes-wrap -->

<footer>
  <div class="fn">C &amp; E</div>
  <div class="fd">05 · 12 · 2026 &nbsp;—&nbsp; Trancoso, Bahia</div>
</footer>

</body>
</html>
